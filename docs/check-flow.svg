<svg viewBox="0 0 790 480" role="img" aria-label="「チェックする」を押したときの流れ：画面が LanguageTool に答案を送り、返ってきた指摘を加工して表示し、記録を端末に保存する" xmlns="http://www.w3.org/2000/svg" font-family="Zen Kaku Gothic New, Hiragino Sans, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#d33a3a"/></marker>
